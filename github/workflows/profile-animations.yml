# ============================================================
# profile-animations.yml
# Generates the two workflow-built images used in README.md:
#   1. 3D contribution graph (static SVG) -> profile-3d-contrib/*.svg on main
#   2. Contribution snake (animated SVG) -> output branch, github-snake-dark.svg
#
# SETUP (one time, ~5 minutes):
#   1. Make sure your profile repo exists and is PUBLIC:
#      github.com/ravindram0/ravindram0  (repo named exactly "ravindram0")
#   2. In that repo, create the file:
#      .github/workflows/profile-animations.yml
#      and paste this whole file into it. Commit.
#   3. Go to the repo's Actions tab, select "Profile animations",
#      click "Run workflow" to generate the images immediately
#      (otherwise they appear after the first nightly run).
#   4. After the run finishes, reload your profile. Both images show up.
#
# Note: the workflow uses the default GITHUB_TOKEN, so normally no extra
# secrets are needed. If your repository or organization restricts
# Actions permissions or protects the branch, the workflow's pushes can
# be blocked - in that case allow read/write for Actions under
# Settings > Actions > General > Workflow permissions.
# ============================================================
name: Profile animations
on:
  schedule:
    - cron: "0 0 * * *"   # every night at 00:00 UTC
  workflow_dispatch:      # allows manual "Run workflow"

permissions:
  contents: write

jobs:
  contrib-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ravindram0
      - name: Commit 3D contribution graph
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A profile-3d-contrib
          git commit -m "Update 3D contribution graph" || echo "no changes"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ravindram0
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
